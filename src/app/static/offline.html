<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QuantNiti — Offline</title>
  <meta name="theme-color" content="#09090b">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body {
      background-color: #09090b;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <div class="glass-card max-w-md w-full p-6 text-center shadow-2xl border border-slate-800">
    <div class="w-16 h-16 rounded-2xl bg-indigo-950/80 border border-indigo-500/40 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/20">
      <i data-lucide="wifi-off" class="w-8 h-8 text-indigo-400"></i>
    </div>
    
    <h1 class="text-xl font-bold text-white mb-2">You're Currently Offline</h1>
    <p class="text-xs text-slate-400 mb-6 leading-relaxed">
      QuantNiti couldn't establish a live connection to the market data feed. Cached data and core app shell remain securely available.
    </p>

    <div class="bg-slate-900/60 rounded-xl p-3 border border-slate-800 text-left mb-6 space-y-2">
      <div class="flex items-center gap-2 text-xs text-slate-300">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
        <span>Offline App Shell Cached</span>
      </div>
      <div class="flex items-center gap-2 text-xs text-slate-300">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
        <span>PWA Local Storage Accessible</span>
      </div>
      <div class="flex items-center gap-2 text-xs text-slate-400">
        <i data-lucide="clock" class="w-4 h-4 text-amber-400"></i>
        <span>Live NIFTY 50 Tick Updates Paused</span>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row gap-3">
      <button onclick="window.location.reload()" class="btn-primary flex-1">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        Retry Connection
      </button>
      <button onclick="window.history.back()" class="btn-ghost flex-1">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Go Back
      </button>
    </div>
  </div>

  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
