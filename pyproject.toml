[project]
name = "quantniti"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jayaditya Dev", email = "jayadityadev261204@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.52.4",
    "yfinance>=1.6.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
